# The standalone `bitos` package repository publishes to npm on a tag
# `v<version>` through npm trusted publishing: the job proves it is this
# repository's publish.yml with a GitHub OIDC token, npm mints a short-lived
# credential for that one run, and no npm token, password or 2FA code is
# involved. One-time setup on npmjs.com, package bitos-cli → Settings →
# Trusted publishing → GitHub Actions: organization unitone-labs,
# repository bitos, workflow publish.yml, no environment.
#
# `dist/bitos.mjs` is committed here by the monorepo's
# scripts/export-cli-package.sh, so nothing is built in this job. A release
# that failed before the setup is re-run by hand from the Actions tab or
# with `gh workflow run publish.yml --ref main`: a manual run publishes the
# version package.json names (npm refuses a version it already has), and
# the tag check below applies to tag pushes only.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here: with it, setup-node writes a placeholder
      # auth token into .npmrc, and npm would try that token instead of the
      # OIDC exchange. The default registry is npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: npm --version
      - name: a pushed tag must name the version in package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: node dist/bitos.mjs version
      - run: npm publish --provenance --access public
